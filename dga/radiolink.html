<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Opening store...</title>
<script>
(function() {
    const ua = navigator.userAgent || navigator.vendor || window.opera;

    // Base app info
    //const desktopWeb = "https://localhost:44353/";
 
    //// Get the full search string
    //const search = window.location.search.substring(1); // remove leading '?'

    //// Extract route=... (but keep its full value, including inner ? and &)
    //const match = search.match(/(^|&)route=([^&]*)/);
    //let route = "/";
    //if (match) {
    //    route = decodeURIComponent(match[2]);
    //}

    //// Remove the "route=..." part from the querystring
    //const otherParams = search
    //    .replace(/(^|&)route=[^&]*/, "")
    //    .replace(/^&/, ""); // cleanup leading & if present

    //// Rebuild the full path
    //const fullPath = route + (otherParams ? (route.includes("?") ? "&" : "?") + otherParams : "");


    // Parse query parameters
    const params = new URLSearchParams(window.location.search);
    let route = params.get("route") || "/"; // default route

    let iosId = params.get("iosId");
    let androidId = params.get("androidId");

    params.delete("route"); // remove route key from query string

    const androidStore  = "https://play.google.com/store/apps/details?id=" + androidId;
    const iosStore      = "https://apps.apple.com/app/" + iosId;
    const desktopWeb = "https://www.infonote.com/";

    // Rebuild query string (excluding route)
    const query = params.toString();
    const fullPath = route + (query ? "?" + query : "");

 
    // Construct app URLs
    const webUrl     = desktopWeb;
 
    function openWithFallback(storeUrl) {
        window.location = storeUrl;

    }
 
    if (/android/i.test(ua)) {
        openWithFallback(androidStore);
    } else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
        openWithFallback(iosStore);
    } else {
        window.location = webUrl;
    }
})();
</script>
</head>
<body>
<p>If you are not redirected, <a id="manualLink" href="#">click here</a>.</p>
<script>
document.getElementById("manualLink").href = window.location.href;
</script>
</body>
</html>
